name: README Checker

on:
  push:
  pull_request:

jobs:
  check-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check README file
        run: |
          if [ -f README.md ]; then
            echo "README file exists!"
          else
            echo "README file is missing!"
            exit 1
          fi
